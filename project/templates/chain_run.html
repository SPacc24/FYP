<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoPenTest — Full Kill Chain</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background: #0f1117; color: #d6dae4; margin: 0; padding: 2rem; }
  h1 { color: #4ade80; }
  .card { background: #171a23; border: 1px solid #262b3a; border-radius: 8px; padding: 1.2rem; margin-bottom: 1.2rem; }
  label { display: block; margin: .6rem 0 .2rem; color: #9aa3b5; font-size: .85rem; }
  input, select { width: 100%; padding: .45rem; background: #0f1117; color: #d6dae4; border: 1px solid #333a4d; border-radius: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  button { margin-top: 1rem; background: #22c55e; color: #04120a; border: 0; padding: .65rem 1.4rem; border-radius: 6px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #262b3a; vertical-align: top; }
  th { color: #9aa3b5; font-size: .8rem; text-transform: uppercase; }
  .ok { color: #4ade80; } .fail { color: #f87171; } .run { color: #facc15; }
  .mitre { color: #7dd3fc; font-size: .78rem; }
  #summary { font-size: 1.05rem; }
</style>
</head>
<body>
<h1>⚔ Full Kill Chain</h1>
<p>web validation → reverse shell → chisel pivot → internal scan → SMB lateral. One run_id, live progress, MITRE per step.</p>

<div class="card">
  <form id="chainForm">
    <div class="row">
      <div>
        <label>Web target (inet VM IP)</label>
        <input name="web_target" value="10.50.138.120" required>
      </div>
      <div>
        <label>Internal range to scan through pivot</label>
        <input name="internal_range" value="10.10.10.0/24" required>
      </div>
    </div>
    <div class="row">
      <div>
        <label>SMB username</label>
        <input name="smb_username" value="smbtest">
      </div>
      <div>
        <label>SMB share</label>
        <input name="smb_share" value="PrivEscLab">
      </div>
    </div>
    <label><input type="checkbox" name="quick" value="1"> Quick mode (scan port 445 only)</label>
    <button type="submit" id="goBtn">▶ Run Chain</button>
  </form>
</div>

<div class="card">
  <div id="summary">No run started.</div>
</div>

<div class="card">
  <table>
    <thead><tr><th>Phase</th><th>Result</th><th>Detail</th><th>MITRE</th><th>Time</th></tr></thead>
    <tbody id="steps"></tbody>
  </table>
</div>

<div class="card">
  <h3 style="margin-top:0">Previous runs</h3>
  <table>
    <thead><tr><th>Run</th><th>Target</th><th>Status</th><th>Started</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</div>

<script>
const fmt = (t) => new Date(t).toLocaleTimeString();
let pollTimer = null;

async function loadHistory() {
  try {
    const r = await (await fetch('/pentest/chain/history')).json();
    const tb = document.getElementById('history');
    tb.innerHTML = '';
    for (const run of (r.runs || [])) {
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>${run.run_id}</td><td>${run.target}</td><td>${run.status}</td><td>${fmt(run.started_at)}</td></tr>`);
    }
  } catch (e) { /* history is best-effort */ }
}

async function poll(runId) {
  const r = await (await fetch(`/pentest/chain/status/${runId}`)).json();
  const tb = document.getElementById('steps');
  tb.innerHTML = '';
  for (const s of (r.steps || [])) {
    const cls = s.ok ? 'ok' : 'fail';
    const mark = s.ok ? '✅' : '❌';
    tb.insertAdjacentHTML('beforeend',
      `<tr><td class="${cls}">${mark} ${s.phase}</td><td>${s.ok ? 'PASS' : 'FAIL'}</td>
       <td>${s.detail}</td><td class="mitre">${(s.mitre || []).join(', ')}</td><td>${fmt(s.timestamp)}</td></tr>`);
  }
  if (r.status === 'running') {
    document.getElementById('summary').innerHTML =
      `<span class="run">⏳ Running… ${(r.steps || []).length} steps completed</span>`;
    pollTimer = setTimeout(() => poll(runId), 2000);
  } else {
    document.getElementById('summary').innerHTML =
      `${r.status === 'completed' ? '<span class="ok">✅' : '<span class="fail">❌'} ${r.status}</span> — ${r.summary}`;
    document.getElementById('goBtn').disabled = false;
    loadHistory();
  }
}

document.getElementById('chainForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  document.getElementById('goBtn').disabled = true;
  document.getElementById('steps').innerHTML = '';
  const fd = new FormData(ev.target);
  const body = {
    web_target: fd.get('web_target').trim(),
    internal_range: fd.get('internal_range').trim(),
    smb_username: fd.get('smb_username').trim(),
    smb_share: fd.get('smb_share').trim(),
    quick: fd.get('quick') === '1',
  };
  const resp = await (await fetch('/pentest/chain/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })).json();
  if (!resp.ok) { document.getElementById('summary').textContent = 'Error: ' + resp.error; document.getElementById('goBtn').disabled = false; return; }
  document.getElementById('summary').textContent = `Run ${resp.run_id} started.`;
  poll(resp.run_id);
});

loadHistory();
</script>
</body>
</html>
