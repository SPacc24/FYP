<section class="flow-card thin-flow-card" id="mission-orchestration">
  <div class="flow-card-header">
    <span class="label">Closed-Loop Orchestration</span>
    <h2>Mission Control</h2>
  </div>

  <div id="missionDashboardPanel">
    <div class="mini-panel" id="missionNoMission">
      <p class="muted">No active mission for this scan. Start a mission to orchestrate evidence-driven exploitation through the closed-loop pipeline.</p>
      <div class="split-row" style="margin-top:.75rem;">
        <select id="missionPlaybookSelect" style="max-width:320px;">
          <option value="">Loading playbooks...</option>
        </select>
        <select id="missionRiskSelect" style="max-width:240px;">
          <option value="validate">validate (safe auto + gated impact)</option>
          <option value="safe-only">safe-only (no impact queue)</option>
        </select>
        <button class="button primary" id="missionStartBtn" type="button">Start Mission</button>
      </div>
    </div>

    <div id="missionActivePanel" class="hidden">
      <div class="metric" id="missionMetrics"></div>
      <div class="stages" id="missionStages"></div>

      <div class="cols" style="margin-top:.5rem;">
        <div>
          <h3 style="font-size:.85rem;color:var(--muted);margin:0 0 .35rem;">Action Queue</h3>
          <div id="missionActionQueue" style="max-height:280px;overflow:auto;font-size:.82rem;"></div>
        </div>
        <div>
          <h3 style="font-size:.85rem;color:var(--muted);margin:0 0 .35rem;">Event Log</h3>
          <div class="log" id="missionEventLog" style="max-height:280px;"></div>
        </div>
      </div>

      <div class="row-actions" style="margin-top:.75rem;">
        <button class="button secondary" id="missionAdvanceBtn" type="button">Advance</button>
        <button class="button secondary" id="missionContinueBtn" type="button">Continue</button>
        <button class="button secondary" id="missionValidateSafeBtn" type="button">Validate Safe Actions</button>
        <button class="button danger" id="missionAbortBtn" type="button">Abort</button>
      </div>

      <div id="missionPendingApprovals" style="margin-top:.75rem;"></div>
    </div>

    <div id="missionDebriefPanel" class="hidden" style="margin-top:.75rem;padding:.75rem;background:#0f1728;border:1px solid #243149;border-radius:12px;"></div>
  </div>

  <div class="summary-strip" id="missionSummary" style="margin-top:.75rem;">
    <article><span class="label">Status</span><strong id="missionStatusBadge">-</strong></article>
    <article><span class="label">Stage</span><strong id="missionStageBadge">-</strong></article>
    <article><span class="label">Actions</span><strong id="missionActionCount">0</strong></article>
    <article><span class="label">Proofs</span><strong id="missionProofCount">0</strong></article>
  </div>
</section>

<script>
  (function() {
    const endpoints = window.DASHBOARD_ENDPOINTS || {};
    const context = window.DASHBOARD_CONTEXT || {};

    let activeMissionId = null;
    let activeMission = null;
    let pollTimer = null;

    // Load playbooks on init
    async function loadPlaybooks() {
      const sel = document.getElementById('missionPlaybookSelect');
      if (!sel) return;
      try {
        const resp = await fetch(endpoints.missionPlaybooks || '/api/mission/playbooks');
        const data = await resp.json();
        sel.innerHTML = '';
        if (data.playbooks && data.playbooks.length) {
          data.playbooks.forEach(pb => {
            const opt = document.createElement('option');
            opt.value = pb.id;
            opt.textContent = pb.title;
            if (pb.default) opt.selected = true;
            sel.appendChild(opt);
          });
        } else {
          sel.innerHTML = '<option value="">No playbooks available</option>';
        }
      } catch(e) {
        sel.innerHTML = '<option value="">Failed to load playbooks</option>';
      }
    }

    function formatTime(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleTimeString(); } catch(e) { return ts; }
    }

    function pillClass(status) {
      const map = {
        running:'pill running', completed:'pill completed', aborted:'pill aborted',
        failed:'pill failed', awaiting_approval:'pill awaiting_approval',
        awaiting_operator:'pill awaiting_operator', blocked_unlock:'pill blocked_unlock'
      };
      return map[status] || 'pill';
    }

    function renderMission(mission) {
      activeMission = mission;
      activeMissionId = mission.mission_id;
      document.getElementById('missionNoMission').classList.add('hidden');
      document.getElementById('missionActivePanel').classList.remove('hidden');

      // Metrics
      let metricsHtml = '';
      metricsHtml += `<div class="m"><b>${mission.playbook_title || mission.playbook_id}</b><span>Playbook</span></div>`;
      metricsHtml += `<div class="m"><b><span class="${pillClass(mission.status)}">${mission.status}</span></b><span>Status</span></div>`;
      metricsHtml += `<div class="m"><b>${mission.stages ? mission.stages.filter(s=>s.status==='completed').length : 0}/${mission.stages ? mission.stages.length : 0}</b><span>Stages</span></div>`;
      if (mission.action_queue) {
        const queued = mission.action_queue.filter(a => a.status === 'queued_auto' || a.status === 'queued_approval');
        metricsHtml += `<div class="m"><b>${queued.length}</b><span>Pending</span></div>`;
      }
      document.getElementById('missionMetrics').innerHTML = metricsHtml;

      // Stages
      let stagesHtml = '';
      if (mission.stages) {
        mission.stages.forEach(s => {
          stagesHtml += `<span class="stage ${s.status}">${s.title}</span>`;
        });
      }
      document.getElementById('missionStages').innerHTML = stagesHtml;

      // Action Queue
      let queueHtml = '<table style="font-size:.78rem;"><thead><tr><th>Action</th><th>Target</th><th>Status</th><th>Risk</th></tr></thead><tbody>';
      if (mission.action_queue && mission.action_queue.length) {
        mission.action_queue.forEach(a => {
          queueHtml += `<tr>
            <td>${a.title || a.catalog_key || '-'}</td>
            <td class="mono">${a.target || '-'}:${a.port || ''}</td>
            <td><span class="pill ${a.status || 'queued'}">${a.status || 'queued'}</span></td>
            <td>${a.risk || '-'}</td>
          </tr>`;
        });
      } else {
        queueHtml += '<tr><td colspan="4" class="small">Queue empty.</td></tr>';
      }
      queueHtml += '</tbody></table>';
      document.getElementById('missionActionQueue').innerHTML = queueHtml;

      // Event log
      let logHtml = '';
      const events = (mission.event_log || []).slice(-20);
      events.forEach(e => {
        logHtml += `<div><span class="muted">${formatTime(e.timestamp)}</span> ${e.message || e.event || ''}</div>`;
      });
      document.getElementById('missionEventLog').innerHTML = logHtml || '<div class="empty">No events yet.</div>';

      // Pending approvals
      let approvalHtml = '';
      if (mission.pending_approvals && mission.pending_approvals.length) {
        approvalHtml = '<div class="panel" style="border-color:#f0b429;margin-top:.5rem;"><h3 style="color:#f0b429;">⚠ Pending Approvals</h3>';
        mission.pending_approvals.forEach(pa => {
          approvalHtml += `<div style="margin:.3rem 0;font-size:.82rem;">
            <strong>${pa.title || pa.catalog_key}</strong> — ${pa.reason || pa.risk || ''}
            <div class="row-actions">
              <button class="btn warn mini mission-approve-btn" data-qid="${pa.queue_id || pa.action_queue_id || pa.id}" data-approved="true">Approve</button>
              <button class="btn danger mini mission-approve-btn" data-qid="${pa.queue_id || pa.action_queue_id || pa.id}" data-approved="false">Deny</button>
            </div>
          </div>`;
        });
        approvalHtml += '</div>';
      }
      document.getElementById('missionPendingApprovals').innerHTML = approvalHtml;

      // Debrief
      if (mission.debrief) {
        const db = document.getElementById('missionDebriefPanel');
        db.classList.remove('hidden');
        db.innerHTML = `<strong>${mission.debrief.reason || 'Debrief'}</strong><br>
          <span class="muted small">Goal: ${mission.debrief.goal_met||'N/A'} | Actions: ${mission.debrief.total_actions||'?'} | Successful: ${mission.debrief.successful_actions||0} | Failed: ${mission.debrief.failed_actions||0}</span>`;
      }

      // Summary strip
      document.getElementById('missionStatusBadge').innerHTML = `<span class="${pillClass(mission.status)}">${mission.status}</span>`;
      const currentStage = mission.stages ? mission.stages.find(s => s.status === 'active') : null;
      document.getElementById('missionStageBadge').textContent = currentStage ? currentStage.title : (mission.current_stage_id || '-');
      document.getElementById('missionActionCount').textContent = mission.action_queue ? mission.action_queue.length : 0;
      document.getElementById('missionProofCount').textContent = mission.proofs ? mission.proofs.length : 0;

      // Rebind approval buttons
      document.querySelectorAll('.mission-approve-btn').forEach(btn => {
        btn.onclick = async function() {
          const qid = this.dataset.qid;
          const approved = this.dataset.approved === 'true';
          try {
            const resp = await fetch(`${endpoints.missionApprove || '/api/mission'}/${activeMissionId}/approve`, {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({action_queue_id: qid, approved: approved})
            });
            const data = await resp.json();
            if (data.ok) renderMission(data.mission);
          } catch(e) { console.error('approve error', e); }
        };
      });
    }

    async function refreshMission() {
      if (!activeMissionId) return;
      try {
        const resp = await fetch(`${endpoints.missionGet || '/api/mission'}/${activeMissionId}`);
        if (!resp.ok) { activeMissionId = null; return; }
        const data = await resp.json();
        if (data.ok && data.mission) renderMission(data.mission);
      } catch(e) {}
    }

    // Start mission button
    document.getElementById('missionStartBtn')?.addEventListener('click', async () => {
      const btn = document.getElementById('missionStartBtn');
      btn.disabled = true;
      btn.textContent = 'Starting...';
      const playbookId = document.getElementById('missionPlaybookSelect').value;
      const riskPosture = document.getElementById('missionRiskSelect').value;
      try {
        const resp = await fetch(endpoints.missionStart || '/api/mission/start', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            playbook_id: playbookId,
            risk_posture: riskPosture,
            scan_id: context.scanId || context.target || '',
            target: context.target || ''
          })
        });
        const data = await resp.json();
        if (data.ok && data.mission) {
          renderMission(data.mission);
          pollTimer = setInterval(refreshMission, 8000);
        } else {
          alert('Mission start failed: ' + (data.error || 'unknown'));
        }
      } catch(e) {
        alert('Mission start error: ' + e.message);
      }
      btn.disabled = false;
      btn.textContent = 'Start Mission';
    });

    // Control buttons
    document.getElementById('missionAdvanceBtn')?.addEventListener('click', async () => {
      if (!activeMissionId) return;
      const resp = await fetch(`${endpoints.missionAdvance || '/api/mission'}/${activeMissionId}/advance`, {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      const data = await resp.json();
      if (data.ok) renderMission(data.mission);
    });

    document.getElementById('missionContinueBtn')?.addEventListener('click', async () => {
      if (!activeMissionId) return;
      const resp = await fetch(`${endpoints.missionContinue || '/api/mission'}/${activeMissionId}/continue`, {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      const data = await resp.json();
      if (data.ok) renderMission(data.mission);
    });

    document.getElementById('missionValidateSafeBtn')?.addEventListener('click', async () => {
      if (!activeMissionId) return;
      const resp = await fetch(`${endpoints.missionValidateSafe || '/api/mission'}/${activeMissionId}/validate-safe`, {
        method:'POST',headers:{'Content-Type':'application/json'},
        body: JSON.stringify({outcome:'success',detail:'Operator-validated safe auxiliary actions from dashboard'})
      });
      const data = await resp.json();
      if (data.ok) renderMission(data.mission);
    });

    document.getElementById('missionAbortBtn')?.addEventListener('click', async () => {
      if (!activeMissionId || !confirm('Abort this mission?')) return;
      const resp = await fetch(`${endpoints.missionAbort || '/api/mission'}/${activeMissionId}/abort`, {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      const data = await resp.json();
      if (data.ok) { clearInterval(pollTimer); document.getElementById('missionActivePanel').classList.add('hidden'); document.getElementById('missionNoMission').classList.remove('hidden'); }
    });

    // Init
    loadPlaybooks();

    // Check for existing mission via scan context
    async function checkExistingMission() {
      const sid = context.scanId || '';
      if (!sid) return;
      try {
        const resp = await fetch(endpoints.missionList || '/api/mission/list?limit=50');
        const data = await resp.json();
        if (data.ok && data.missions) {
          const existing = data.missions.find(m => m.scan_id === sid && (m.status === 'running' || m.status === 'awaiting_approval' || m.status === 'awaiting_operator'));
          if (existing) {
            // Load full mission
            const fullResp = await fetch(`${endpoints.missionGet || '/api/mission'}/${existing.mission_id}`);
            const fullData = await fullResp.json();
            if (fullData.ok && fullData.mission) {
              renderMission(fullData.mission);
              pollTimer = setInterval(refreshMission, 8000);
            }
          }
        }
      } catch(e) {}
    }
    checkExistingMission();
  })();
</script>
